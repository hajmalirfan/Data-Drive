name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agri-project/backend
    env:
      # Tests use in-memory SQLite; nothing touches a shared database.
      DATABASE_URL: sqlite://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The pinned dependencies (pydantic 2.10.4) install on 3.12, not 3.13+.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agri-project/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app scripts
      - run: python -m pytest -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agri-project/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agri-project/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the commits in this push or pull request for keys, tokens and passwords.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
